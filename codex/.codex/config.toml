model = "gpt-5-codex"
model_provider = "azure"
model_reasoning_effort = "medium"
model_reasoning_summary = "detailed"
sandbox_mode = "workspace-write"

[model_providers.azure]
name = "Azure OpenAI"
base_url = "https://azai-eus2-connected-auto-dev-01.openai.azure.com/openai/v1"
env_key = "AZURE_OPENAI_API_KEY"
wire_api = "responses"

[features]
streambale_shell = true
rmcp_client = true
#web_search_request = true

[profiles.code]
model = "gpt-5"
model_provider = "azure"
model_reasoning_effort = "high"
model_reasoning_summary = "detailed"
approval_policy = "on-request"


[profiles.codex]
model = "gpt-5-codex"
model_provider = "azure"
model_reasoning_effort = "high"
model_reasoning_summary = "detailed"
approval_policy = "on-request"

[profiles.plan]
model = "gpt-5-codex"
model_provider = "azure"
model_reasoning_effort = "medium"
model_reasoning_summary = "detailed"
sandbox_mode = "read-only"
approval_policy = "on-failure"

[profiles.planpro]
model = "gpt-5-pro"
model_provider = "azure"
model_reasoning_effort = "medium"
model_reasoning_summary = "detailed"
sandbox_mode = "read-only"
approval_policy = "on-failure"

[profiles.review]
model = "gpt-5"
model_provider = "azure"
model_reasoning_effort = "medium"
model_reasoning_summary = "detailed"
sandbox_mode = "read-only"
approval_policy = "on-failure"

[projects."/home/rahulnakmol/.dotfiles"]
trust_level = "trusted"

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp", "--api-key", "${CONTEXT7_API_KEY}"]

[mcp_servers.figma]
url = "https://mcp.figma.com/mcp"

[mcp_servers.gcloud]
command = "npx"
args = ["-y", "@google-cloud/gcloud-mcp"]

[mcp_servers.playwright]
command = "npx"
args = ["@playwright/mcp@latest"]

[mcp_servers.sequential-thinking]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-sequential-thinking"]

[mcp.github]
url = "https://api.githubcopilot.com/mcp/"

[mcp.github.headers]
Authorization = "Bearer ${GITHUB_PAT}"

[mcp.azure]
command = "npx"
args = ["-y", "@azure/mcp@latest", "server", "start"]

# BEGIN agent-policy (managed by apply-agent-policy.mjs)
[shell_environment_policy]
exclude = ["AWS_*","AZURE_*","GCP_*","GOOGLE_*","GITHUB_*","OP_*","DIGITALOCEAN_*","NETLIFY_*","HEROKU_*","VAULT_*"]
ignore_default_excludes = false
# END agent-policy
